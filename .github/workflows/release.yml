name: Release compiled component
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_tag:
        description: Existing matching version tag (v<SemVer>); never creates a tag
        required: true
        type: string
      require_apple_signing:
        description: Require Apple signing even when the version policy is unsigned
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.release_ref.outputs.sha }}
      release_tag: ${{ steps.release_ref.outputs.tag }}
      apple_signing: ${{ steps.signing_policy.outputs.apple_signing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve existing version tag to an immutable commit
        id: release_ref
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: >-
          python scripts/release_ref.py resolve
          --event "$GITHUB_EVENT_NAME" --ref-type "$GITHUB_REF_TYPE"
          --ref-name "$GITHUB_REF_NAME" --version-tag "$VERSION_TAG"
          --event-sha "$GITHUB_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_ref.outputs.sha }}
      - name: Require initialized matching repository, version tag and explicit 4D opt-in
        env:
          FOURD_ENABLED: ${{ vars.FOURD_ENABLED }}
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: python scripts/ci_config.py validate --release --tag "$RELEASE_TAG"
      - name: Resolve version signing policy without accessing secrets
        id: signing_policy
        env:
          REQUIRE_APPLE_SIGNING: ${{ inputs.require_apple_signing }}
        shell: python
        run: |
          import os, subprocess, sys
          arguments = [sys.executable, "scripts/sign_release.py", "policy", "--root", "."]
          if os.environ["REQUIRE_APPLE_SIGNING"] == "true":
              arguments.append("--require-apple-signing")
          subprocess.run(arguments, check=True)

  native:
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.gate.outputs.source_sha }}
      release_call: true

  compile:
    needs: [gate, native]
    runs-on: macos-15
    env:
      FOURD_ENABLED: ${{ vars.FOURD_ENABLED }}
      TOOL4D_URL: ${{ vars.TOOL4D_URL }}
      TOOL4D_SHA256: ${{ vars.TOOL4D_SHA256 }}
      RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.gate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ci_config.py validate --release --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-x64
          path: build/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-arm64
          path: build/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-x64
          path: build/windows-x64
      - name: Download SHA-256-verified tool4D
        run: python scripts/ci_config.py download-tool4d
      - name: Build and accept unsigned component without Apple secrets
        if: needs.gate.outputs.apple_signing == 'false'
        run: >-
          python scripts/accept_hosted.py --repository "$GITHUB_REPOSITORY"
          --tool4d .tools/tool4d.app/Contents/MacOS/tool4d --tag "$RELEASE_TAG"
      - name: Sign, notarize, staple and accept the exact final ZIP
        if: needs.gate.outputs.apple_signing == 'true'
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
          CODESIGN_APPLE_ID: ${{ secrets.CODESIGN_APPLE_ID }}
        run: >-
          python scripts/accept_hosted.py --repository "$GITHUB_REPOSITORY"
          --tool4d .tools/tool4d.app/Contents/MacOS/tool4d --tag "$RELEASE_TAG"
          --require-apple-signing
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-release
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*-signing.json
            dist/*.acceptance.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain source, compiler and final-host diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-diagnostics
          path: |
            build/hosted-acceptance.json
            build/source-host-status.json
            build/compile-status.json
            build/unsigned-compiled-host-status.json
            build/compiled-host-status.json
            build/host-status.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [gate, compile]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: compiled-release
          path: dist
      - name: Publish only after compilation and packaging succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.gate.outputs.source_sha }}
          APPLE_SIGNING: ${{ needs.gate.outputs.apple_signing }}
        run: |
          git fetch --force --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python scripts/release_ref.py verify --tag "$RELEASE_TAG" --expected-sha "$RELEASE_SHA"
          signing=()
          if [ "$APPLE_SIGNING" = "true" ]; then signing+=(--require-apple-signing); fi
          python scripts/release_assets.py --repository "$GH_REPO" --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" "${signing[@]}" --publish
